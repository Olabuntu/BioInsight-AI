[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bioinsight-ai"
version = "0.2.0"
description = "A modular GWAS pipeline — pick the tools you need (loaders, models, correction methods, plots) with AI-assisted interpretation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Abhishek Sahu", email = "asahu@salud.unm.edu" }]
keywords = ["bioinformatics", "gwas", "genomics", "omics", "visualization"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pandas>=1.5",
    "matplotlib>=3.5",
    "tabulate>=0.9",
]

[project.optional-dependencies]
stats = ["scipy>=1.9"]
dev = ["pytest>=7.0", "scipy>=1.9", "statsmodels>=0.13"]

[project.urls]
Homepage = "https://github.com/Olabuntu/BioInsight-AI"
Issues = "https://github.com/Olabuntu/BioInsight-AI/issues"

[project.scripts]
bioinsight = "bioinsight.cli:main"

[tool.setuptools.packages.find]
include = ["bioinsight*"]
